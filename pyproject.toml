[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeguide"
version = "0.1.0"
description = "Inference-time safety layer for frozen flow-matching VLA policies: runtime constraints as cost functions, applied by guiding the policy's own denoising."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
groot = ["pyzmq", "msgpack", "msgpack-numpy"]        # zmq bridge to a GR00T policy server (safeguide/remote.py, safeguide/server/)
benchmarks = ["imageio", "matplotlib", "pillow"]      # LIBERO evaluator extras (recording); LIBERO / openpi themselves are installed separately

[tool.setuptools.packages.find]
include = ["safeguide*"]
